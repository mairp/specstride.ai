name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: astro check
        run: npm run check
      - name: Link check
        run: |
          npx astro preview --port 4321 &
          npx --yes wait-on@9 -t 60000 http://localhost:4321/
          npx linkinator http://localhost:4321/ --recurse --retry --timeout 20000 \
            --skip '^https://specstride\.ai' --skip '^https://(www\.)?linkedin\.com'
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    # Deploys main after the checks pass. Skipped until the repository has the
    # CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README).
    # The token needs only Account → Workers Scripts: Edit; triggers and custom
    # domains are left as they are, so no zone permission is required.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN != '' }}
    steps:
      - name: Skip without a deploy token
        if: env.HAS_TOKEN != 'true'
        run: echo "No CLOUDFLARE_DEPLOY_TOKEN secret; deploy from the host with npm run deploy."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: Build
        if: env.HAS_TOKEN == 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload and deploy a new version
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler versions upload --message "ci ${GITHUB_SHA::7}")
          echo "$out"
          id=$(echo "$out" | sed -n 's/.*Worker Version ID: *\([0-9a-f-]*\).*/\1/p' | tail -1)
          test -n "$id"
          npx wrangler versions deploy "$id@100%" --yes
