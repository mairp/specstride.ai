# Harnesses: the agents Specstride can run as the implementer (the coding agent)
# or as the reviewer (the judge). Only `available` entries are shown. The role
# words on the page are implementer and reviewer; the schema's internal enum
# stays `proposer`/`critic`.
- id: claude
  name: Claude
  order: 1
  roles: [proposer, critic]
  status: available
  note: The default. Implementer and reviewer are two separate sessions through your Claude Code login.
- id: dsh
  name: dsh
  order: 2
  roles: [proposer, critic]
  status: available
  note: Implementer or reviewer on any provider and model your DeepSeek Harness (`dsh`) reaches. Parallel units need dsh as the implementer.
