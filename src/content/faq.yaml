- id: llm-judge
  order: -3
  q: Isn't an LLM judging an LLM circular?
  a: 'It would be, if the judge only read the implementer''s report. This is LLM-as-a-judge with the parts the bare pattern leaves out. The engine runs the tests itself before the reviewer sees anything. The reviewer is a separate session with no tools, chosen independently of the implementer and on any provider. It reads the actual change against the phase''s tasks, not a summary it is handed. Its verdict is bound to a one-time nonce and written as a signed record, so planted text cannot pass for it. It is a second opinion held to evidence, not a proof: [the reviewer section](/#judge) shows what reaches it and what is held back.'
- id: ci
  order: -2
  q: Why not just CI?
  a: 'Keep your CI. It tells you after a push. Specstride gates each phase before its commit exists: the engine runs the phase''s checks itself, a phase whose tests fail never reaches review, a rejection goes back to the implementer with the reasons, and only an approved phase becomes a commit.'
- id: plain-loop
  order: -1
  q: Why not just loop the agent until it says it is finished?
  a: 'Because then the agent that did the work decides when it is done, and an agent that grades its own work says "done" when it isn''t. A plain loop also has no brakes. [The comparison](/#compare) puts it beside Specstride, where attempts are capped, every stop has a named reason and an exit code, and a rejected phase is diagnosed before it is retried.'
- id: which
  order: 0
  q: Which one do I want — the plugin, dsh, Hermes or core?
  a: 'The host that matches the agent you already use: in Claude Code, the [plugin](/products/claude-code-plugin/); in the DeepSeek Harness, the [dsh host](/products/specstride-dsh/); in Hermes, the [Hermes host](/products/specstride-hermes/). Each is one command: `curl -fsSL https://specstride.ai/install.sh | bash -s -- plugin` (or `dsh`, `hermes`). The [core](/products/specstride-core/) is not a fourth choice but the engine all three are built on: the plugin''s skills run its CLI and the other two pin its release, so the loop, the gates, the records and the commits are the same whichever host you pick. Install the core alone only to run the `specstride` CLI from a shell or to build a host for another agent.'
- id: loop-engineering
  order: 0.5
  q: What is loop engineering?
  a: 'An agent session is a loop with no brakes. Loop engineering designs the loops around it instead: pipeline stages, phases, attempts, passes and micro cycles, each with a defined end, deterministic checks before any reviewer opinion, and a rule-driven router that decides what happens when a loop gets stuck. The [core page](/products/specstride-core/) shows the engine layer by layer.'
- id: spec-kit
  order: 1
  q: Do I need Spec Kit?
  a: 'You need the format, not its tooling. A feature is a `specs/NAME/` directory with a `tasks.md`: `## Phase N: Title` headings and `- [ ] T001 …` tasks are what [Spec Kit](https://github.com/github/spec-kit) writes, and you can write them by hand. `spec.md` and `plan.md` beside the tasks, if you have them, go to the implementer with the tasks.'
- id: models
  order: 2
  q: Which models can it use?
  a: 'Any you trust. Specstride is an orchestrator and does not rank models. The implementer and the reviewer are chosen independently: by default both are separate Claude sessions through your Claude Code login, and either can instead be any provider and model your DeepSeek Harness (`dsh`) reaches.'
- id: stuck
  order: 4
  q: What happens when a phase keeps failing?
  a: "It is not just started again. When the reviewer's rejection names unmet tasks the phase has not been diagnosed for yet, a diagnostician — a fresh session, never the implementer's — reads the phase and writes a hint, and the next attempt is narrowed to those tasks with the hint as its first instruction. Both are on by default (`SPECSTRIDE_DIAGNOSTICIAN=false` or `SPECSTRIDE_ACCELERATOR=false` turns one off). A phase gets up to 3 attempts; after the third rejection the run stops with exit 2, the reasons are in the output, and a new run resumes from the phases already approved."
- id: local
  order: 5
  q: What leaves my machine?
  a: Nothing is sent to Specstride's authors; there is no service of its own. What you choose goes to your model providers — the implementer reads the feature's spec, plan, tasks and the reviewer's feedback; the reviewer reads the tasks, the test output and the change. Each provider's own data policy applies. Run records, approvals and logs stay in `~/.specstride/` on your machine, and telemetry export is off by default.
- id: cost
  order: 6
  q: What does it cost?
  a: Nothing for Specstride itself — it is free and open source under Apache-2.0. Each phase makes at least two model calls on your own subscription or API key, so a run costs more than a single session would.
- id: macos
  order: 7
  q: Does it run on macOS?
  a: macOS is not verified — no Mac has run it. Linux is what it runs on today.
- id: anthropic
  order: 8
  q: Is it from Anthropic?
  a: No. Specstride is not affiliated with Anthropic.
- id: contribute
  order: 9
  q: How do I contribute?
  a: Issues and pull requests on [the plugin repository](https://github.com/mairp/specstride-plugin), following [CONTRIBUTING.md](https://github.com/mairp/specstride-plugin/blob/main/CONTRIBUTING.md) — add a test with each change, keep the import boundaries, and run the formatter before you push. Good first issues are labelled `good first issue`. Questions and bugs go to [issues](https://github.com/mairp/specstride-plugin/issues).
