- id: spec-kit
  order: 1
  q: Do I need Spec Kit?
  a: 'You need the format, not its tooling. A feature is a `specs/NAME/` directory with a `tasks.md`: `## Phase N: Title` headings and `- [ ] T001 …` tasks are what [Spec Kit](https://github.com/github/spec-kit) writes, and you can write them by hand. `spec.md` and `plan.md` beside the tasks, if you have them, go to the implementer with the tasks.'
- id: models
  order: 2
  q: Which models can it use?
  a: 'Any you trust. Specstride is an orchestrator and does not rank models. The implementer and the reviewer are chosen independently: by default both are separate Claude sessions through your Claude Code login, and either can instead be any provider and model your DeepSeek Harness (`dsh`) reaches.'
- id: rubber-stamp
  order: 3
  q: What stops the reviewer waving work through?
  a: The reviewer is a separate session with no tools. It reads the actual change against the phase's tasks — not a summary it is handed — and it must answer with a one-time nonce, so planted text cannot pass for its verdict. The engine runs the tests itself, so the claim it reads was checked against a real run. Credentials are redacted from what it reads.
- id: stuck
  order: 4
  q: What happens when a phase keeps failing?
  a: "It is not just started again. When the reviewer's rejection names unmet tasks the phase has not been diagnosed for yet, a diagnostician — a fresh session, never the implementer's — reads the phase and writes a hint, and the next attempt is narrowed to those tasks with the hint as its first instruction. Both are on by default (`SPECSTRIDE_DIAGNOSTICIAN=false` or `SPECSTRIDE_ACCELERATOR=false` turns one off). A phase gets up to 3 attempts; after the third rejection the run stops with exit 2, the reasons are in the output, and a new run resumes from the phases already approved."
- id: local
  order: 5
  q: What leaves my machine?
  a: Nothing is sent to Specstride's authors; there is no service of its own. What you choose goes to your model providers — the implementer reads the feature's spec, plan, tasks and the reviewer's feedback; the reviewer reads the tasks, the test output and the change. Each provider's own data policy applies. Run records, approvals and logs stay in `~/.specstride/` on your machine, and telemetry export is off by default.
- id: cost
  order: 6
  q: What does it cost?
  a: Nothing for Specstride itself — it is free and open source under Apache-2.0. Each phase makes at least two model calls on your own subscription or API key, so a run costs more than a single session would.
- id: macos
  order: 7
  q: Does it run on macOS?
  a: macOS is not verified — no Mac has run it. Linux is what it runs on today.
- id: anthropic
  order: 8
  q: Is it from Anthropic?
  a: No. Specstride is not affiliated with Anthropic.
- id: contribute
  order: 9
  q: How do I contribute?
  a: Issues and pull requests on [the plugin repository](https://github.com/mairp/specstride-plugin), following [CONTRIBUTING.md](https://github.com/mairp/specstride-plugin/blob/main/CONTRIBUTING.md) — add a test with each change, keep the import boundaries, and run the formatter before you push. Good first issues are labelled `good first issue`. Questions and bugs go to [issues](https://github.com/mairp/specstride-plugin/issues).
