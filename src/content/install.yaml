# Install paths. Rules: a step goes here only after it was run by hand, exactly as
# written, and the date goes in `verified`. Paths that don't work yet have no
# steps and a status other than `available`, which keeps them off the site.
- id: claude-code
  label: Claude Code
  status: available
  order: 1
  product: claude-code-plugin
  summary: Install the plugin in Claude Code, then take the ready-made example feature through its first run before pointing it at your own repository.
  prereqs:
    - 'Linux. macOS is not verified: no Mac has run it.'
    - Node 22+, git and Claude Code
    - 'A Spec Kit feature: a `specs/NAME/` directory with a `tasks.md`, in a git repository (optionally with `spec.md` and `plan.md` beside it)'
    - A `test` script in `package.json`
    - Your own subscription or API key for the models you choose
  steps:
    - note: in Claude Code
      cmd: /plugin marketplace add mairp/specstride-plugin
    - cmd: /plugin install specstride@specstride-marketplace
    - note: to try it on a ready-made feature first
      cmd: git clone https://github.com/mairp/specstride-example
    - cmd: cd specstride-example
    - cmd: claude
    - note: then say
      cmd: Run Specstride on the feature in this repo.
  after: On your own repository — any git repo with a `specs/NAME/tasks.md` and a `test` script in `package.json` — say the same sentence. Each approved phase becomes its own commit.
  verified: '2026-11-05'
