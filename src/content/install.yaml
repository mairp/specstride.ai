# Install paths. Rules: a step goes here only after it was run by hand, exactly as
# written, and the date goes in `verified`. Paths that don't work yet have no
# steps and a status other than `available`, which keeps them off the site.
- id: claude-code
  label: Claude Code
  status: available
  order: 1
  product: claude-code-plugin
  summary: Install the plugin in Claude Code, then take the ready-made example feature through its first run before pointing it at your own repository.
  prereqs:
    - 'Linux. macOS is not verified: no Mac has run it.'
    - Node 22+, git and Claude Code
    - 'A Spec Kit feature: a `specs/NAME/` directory with a `tasks.md`, in a git repository (optionally with `spec.md` and `plan.md` beside it)'
    - A `test` script in `package.json`
    - Your own subscription or API key for the models you choose
  steps:
    - note: in Claude Code
      cmd: /plugin marketplace add mairp/specstride-plugin
    - cmd: /plugin install specstride@specstride-marketplace
    - note: to try it on a ready-made feature first
      cmd: git clone https://github.com/mairp/specstride-example
    - cmd: cd specstride-example
    - cmd: claude
    - note: then say
      cmd: Run Specstride on the feature in this repo.
  after: On your own repository — any git repo with a `specs/NAME/tasks.md` and a `test` script in `package.json` — say the same sentence. Each approved phase becomes its own commit.
  verified: '2026-11-05'
- id: dsh
  label: dsh
  status: available
  order: 2
  product: specstride-dsh
  summary: Build the dsh host from a clone, install it with the engine's CLI from the tarball it pins, then put the three skills into your repository. Nothing is on npm yet.
  prereqs:
    - 'Linux. macOS is not verified.'
    - Node 22+ and git
    - '`dsh` 0.1.0-rc.8 on the search path'
    - 'A Spec Kit feature in a git repository'
  steps:
    - cmd: git clone https://github.com/mairp/specstride-dsh
    - cmd: cd specstride-dsh
    - note: resolves the pinned engine tarballs; nothing compiles
      cmd: npm install
    - note: renders the skills and the shim, runs every build gate
      cmd: npm run build
    - note: specstride-host-dsh and the specstride CLI this repository pins
      cmd: npm install -g . vendor/core/specstride-0.1.0.tgz
    - note: in your repository; the skills go into .dsh/skills/
      cmd: specstride-host-dsh install --project
    - note: six findings, one line each
      cmd: specstride-host-dsh doctor
  after: 'Then, in a dsh session in your repository, say "run the specstride-run skill in dry-run on the feature". It plans and validates and launches nothing. Drop "in dry-run" to run the feature for real.'
  verified: '2026-11-08'
- id: core
  label: Core (CLI)
  status: available
  order: 3
  product: specstride-core
  summary: Build the engine from a clone and pack its release. Install the `specstride` CLI on its own, to run it from a shell or to build a host on it. Nothing is on npm yet.
  prereqs:
    - 'Linux. macOS is not verified.'
    - Node 22+ and git
  steps:
    - cmd: git clone https://github.com/mairp/specstride-core
    - cmd: cd specstride-core
    - cmd: npm ci
    - note: packs the four release tarballs into .build/release/
      cmd: node scripts/pack-release.mjs
    - cmd: npm install -g .build/release/specstride-0.1.0.tgz
    - note: prints the CLI protocol, 1
      cmd: specstride --protocol
    - note: in your repository
      cmd: specstride doctor
  after: '`specstride --help` lists every verb. Each verb takes `--json`, `--verbose` and `-h`. To build a host, start from `@specstride/host-kit` and pass the conformance suite in `@specstride/testkit`. See the core README.'
  verified: '2026-11-08'
