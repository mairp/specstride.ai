# Roadmap items. `stage` is free text shown beside the status chip. Link only to
# public pages; leave `links` empty for work whose repository is not public.
- id: cli-v0-1
  title: Specstride CLI v0.1.0
  product: specstride-cli
  status: available
  stage: Released 2026-09-26
  order: 1
  summary: The gated loop with the critic, the diagnostician and the accelerator, live presenter, OpenTelemetry and Loki export.
  links:
    - label: Release notes
      href: https://github.com/mairp/specstride/releases/tag/v0.1.0
- id: cli-learning
  title: Self-tuning with automatic rollback
  product: specstride-cli
  status: available
  stage: In the CLI, opt-in
  order: 2
  summary: Per-phase settings learned from run telemetry, evaluated against their baseline after every approved phase, reverted when a guardrail breaks.
  links:
    - label: How learning works
      href: https://github.com/mairp/specstride/blob/main/wiki/Learning.md
- id: cli-reverse
  title: Reverse mode
  product: specstride-cli
  status: available
  stage: In the CLI
  order: 3
  summary: Turns an existing codebase into an as-is Spec Kit feature, one gate at a time, with every requirement citing the lines it came from.
  links:
    - label: Reverse engineering
      href: https://github.com/mairp/specstride/blob/main/wiki/Reverse-Engineering.md
- id: core-first-slice
  title: "TypeScript core: kernel, contracts and the detached runtime"
  product: specstride-core
  status: in-progress
  stage: Wave 1 · being built
  order: 10
  summary: Schemas, the atomic write, the redactor and the process primitive first, then a runtime that survives its host session and relaunches only what its own records call transient.
- id: core-parity
  title: Parity with today's CLI
  product: specstride-core
  status: in-progress
  stage: Wave 1 · release condition
  order: 11
  summary: A parity suite replays the CLI's behaviour against the port. Nothing is released until every parity test passes.
- id: core-micro-loops
  title: Micro-loops that fail fast
  product: specstride-core
  status: in-progress
  stage: Wave 1 · specified
  order: 12
  summary: Long checks stop at the first failure, units of work stay small enough that no pass hits its time cap, and finished work is kept when a pass ends.
- id: core-discovery
  title: Harness discovery and role resolution
  product: specstride-core
  status: in-progress
  stage: Wave 1 · specified
  order: 13
  summary: Finds the agents you already have, including ones with no dedicated adapter, and resolves who proposes and who judges, per phase.
- id: core-adapters-w1
  title: Adapters for Claude, Codex, dsh and pi
  product: specstride-core
  status: in-progress
  stage: Wave 1 · specified
  order: 14
  summary: Each adapter is a descriptor, optional code hooks and recorded fixtures, built against the same harness seam.
- id: claude-code-plugin
  title: Claude Code plugin
  product: claude-code-plugin
  status: in-progress
  stage: Wave 1 · specified
  order: 15
  summary: The specstride-run and specstride-reverse skills, a doctor skill, and hook shims, as a thin layer over the published package.
- id: dsh-plugin
  title: dsh plugin
  product: dsh-plugin
  status: planned
  stage: Wave 2
  order: 20
  summary: The same skills on dsh, through the same CLI protocol.
- id: run-viewer
  title: Run viewer
  product: specstride-core
  status: planned
  stage: Wave 2
  order: 21
  summary: A terminal follower and a read-only web viewer bound to loopback, both over the same read model as specstride status.
- id: adapters-w3
  title: Adapters for Gemini CLI, Copilot CLI, opencode, OpenRouter and z.ai
  product: specstride-core
  status: planned
  stage: Wave 3 and later
  order: 30
  summary: One adapter per harness. Until one ships, the harness is usable through the generic descriptor adapter as an unverified harness.
- id: parallel-features
  title: Parallel features in separate workspaces
  product: specstride-core
  status: planned
  stage: After Wave 1, on measurement
  order: 31
  summary: Comes back only when an experiment shows the saving. Each parallelism step waits for the measurement before it.
- id: codex-plugin
  title: Codex plugin
  product: codex-plugin
  status: planned
  stage: Not scheduled
  order: 32
  summary: The same skills inside Codex.
